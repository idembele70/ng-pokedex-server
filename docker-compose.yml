services:

  server_nodejs:
    container_name: ng_pokedex_server
    depends_on:
      - mongo
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DOCKER_PORT: ${APP_DOCKER_PORT}
    # env_file: ${ENV_FILE}
    ports:
      - ${APP_LOCAL_PORT}:${APP_DOCKER_PORT}

  mongo:
    image: mongo:latest
    container_name: ng-pokedex_mongodb
    restart: unless-stopped
    # env_file: ${ENV_FILE}
    ports: 
      - "${MONGO_LOCAL_PORT}:${MONGO_DOCKER_PORT}"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    volumes:
      - ./docker/init.js:/docker-entrypoint-initdb.d/init.js
      - ./docker/pokemons.json:/docker-entrypoint-initdb.d/pokemons.json